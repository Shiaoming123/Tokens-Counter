name: Bug report
description: Report a reproducible problem in the workbench, model catalog, or public API.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AI Token Counter.

        Do not include API keys, private prompts, customer data, screenshots with secrets, or provider account details.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web workbench
        - Public API
        - Model catalog
        - Pricing estimate
        - Tokenizer / accuracy label
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What happened?
      description: Describe the current behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include a minimal example that does not contain secrets or private data.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
        4. See ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / environment
      placeholder: Chrome 125, Edge 125, API client, self-hosted, etc.
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Logs, screenshots, or response snippets are helpful if they do not expose secrets.

